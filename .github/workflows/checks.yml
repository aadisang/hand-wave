name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          lfs: true
      - uses: ./.github/actions/setup-ios-simulator
        id: simulator
      - uses: ./.github/actions/setup-tuist
      - uses: ./.github/actions/setup-contract
      - name: Install test dependencies
        run: |
          uv sync --frozen --project apps/inference --group deploy
          pnpm --filter @hand-wave/web exec playwright install chromium
      - name: Static checks
        run: |
          pnpm exec moon run web:lint web:typecheck inference:lint inference:formatCheck inference:typecheck contract:generatedCheck
          uv run --project apps/inference --frozen ruff check scripts/e2e.py
          uv run --project apps/inference --frozen ruff format --check scripts/e2e.py
          uv run --project apps/inference --frozen --group deploy pyright scripts/e2e.py
      - name: Real service, browser, and native client
        env:
          IOS_DESTINATION: ${{ steps.simulator.outputs.destination }}
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
        run: pnpm test --output artifacts/e2e/ci
      - name: Documented isolated regressions
        env:
          IOS_DESTINATION: ${{ steps.simulator.outputs.destination }}
          IOS_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/isolated/mobile
        run: |
          pnpm exec moon run web:testIsolated inference:test
          bash apps/mobile/scripts/test.sh isolated Debug
      - name: Save repeatable test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
