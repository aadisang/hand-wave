name: iOS

on:
  pull_request:
    paths:
      - ".github/actions/setup-contract/**"
      - ".github/workflows/ios.yml"
      - ".github/workflows/testflight.yml"
      - "apps/mobile/**"
      - "package.json"
      - "packages/contract/**"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-contract/**"
      - ".github/workflows/ios.yml"
      - ".github/workflows/testflight.yml"
      - "apps/mobile/**"
      - "package.json"
      - "packages/contract/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Set up Tuist
        uses: ./.github/actions/setup-tuist

      - name: Set up contract
        uses: ./.github/actions/setup-contract

      - name: Generate workspace
        working-directory: apps/mobile
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
        run: |
          tuist install
          tuist generate --no-open
          pod install

      - name: Test
        working-directory: apps/mobile
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
        run: |
          tuist xcodebuild test \
            -workspace HandWave.xcworkspace \
            -scheme HandWave \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath Derived/CI
