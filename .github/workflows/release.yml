name: Release

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: What changed in this release?
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Set up Tuist
        uses: ./.github/actions/setup-tuist

      - name: Set up contract
        uses: ./.github/actions/setup-contract

      - name: Check web and inference
        env:
          VITE_INFERENCE_URL: https://inference.invalid
        run: |
          uv sync --frozen --project apps/inference --group deploy
          pnpm exec moon run web:lint web:typecheck web:test web:build inference:lint inference:typecheck inference:test contract:generatedCheck

      - name: Generate workspace
        working-directory: apps/mobile
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
        run: |
          tuist install
          tuist generate --no-open
          pod install

      - name: Test
        working-directory: apps/mobile
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
        run: |
          tuist xcodebuild test \
            -workspace HandWave.xcworkspace \
            -scheme HandWave \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath Derived/TestFlightVerification

  release:
    name: Publish verified release
    needs: verify
    environment: testflight
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check web release configuration
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in the testflight GitHub environment before releasing."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile

      - name: Set up Tuist
        uses: ./.github/actions/setup-tuist

      - name: Set up contract
        uses: ./.github/actions/setup-contract

      - name: Deploy and verify the backend for this commit
        id: backend
        working-directory: apps/inference
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uv run --frozen --group deploy python -m tools.release --revision "$GITHUB_SHA"

      - name: Build the paired web app
        env:
          VITE_INFERENCE_URL: ${{ steps.backend.outputs.url }}
        run: |
          pnpm dlx vercel@62.7.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@62.7.0 build --prod --token="$VERCEL_TOKEN"

      - name: Generate workspace
        working-directory: apps/mobile
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
        run: |
          tuist install
          tuist generate --no-open
          pod install

      - name: Test the release client against its backend
        working-directory: apps/mobile
        run: |
          xcodebuild test \
            -workspace HandWave.xcworkspace \
            -scheme HandWave \
            -configuration Release \
            ENABLE_TESTABILITY=YES \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath Derived/ReleaseVerification

      - name: Import distribution certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          profile="$RUNNER_TEMP/HandWaveAppStore.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"

      - name: Restore release configuration
        working-directory: apps/mobile
        env:
          HANDWAVE_XCCONFIG_BASE64: ${{ secrets.HANDWAVE_XCCONFIG_BASE64 }}
        run: printf '%s' "$HANDWAVE_XCCONFIG_BASE64" | base64 --decode > Configurations/HandWave.xcconfig

      - name: Build the paired iOS app
        working-directory: apps/mobile
        env:
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_PROFILE_NAME: ${{ vars.APPSTORE_PROFILE_NAME }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}
        run: bundle exec fastlane ios build_release

      - name: Publish iOS to TestFlight
        working-directory: apps/mobile
        env:
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}
        run: bundle exec fastlane ios publish_release

      - name: Publish the paired web app
        run: pnpm dlx vercel@62.7.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Record the released backend
        if: success()
        run: cat .handwave/release.json >> "$GITHUB_STEP_SUMMARY"
