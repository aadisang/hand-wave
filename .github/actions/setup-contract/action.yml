name: Set up contract
description: Install the pinned JavaScript tools and generate contract clients

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    - name: Set up pnpm
      shell: bash
      run: npm install --global pnpm@10.33.0

    - name: Install JavaScript dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate contract clients
      shell: bash
      run: pnpm run contract:regen
