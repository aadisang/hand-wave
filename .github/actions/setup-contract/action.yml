name: Set up contract
description: Install the pinned JavaScript tools and generate contract clients

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 10.33.0
        run_install: false

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: pnpm

    - name: Install JavaScript dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate contract clients
      shell: bash
      run: pnpm run contract:regen
