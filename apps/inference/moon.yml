$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'python'
stack: 'backend'
tags:
  - 'fastapi'
  - 'inference'

project:
  description: 'FastAPI service that owns model loading and CTC decoding.'

dependsOn:
  - 'contract'

tasks:
  typecheck:
    command: 'uv run --frozen --group deploy pyright'
    options:
      mergeArgs: 'replace'
    deps:
      - 'contract:generate'

  test:
    command: 'uv run --frozen --group deploy python -m pytest'
    options:
      mergeArgs: 'replace'
    deps:
      - 'contract:generate'
    inputs:
      - 'models/**/*'

  dev:
    command: 'uv run --frozen --group deploy python -m tools.dev'
    deps:
      - 'contract:generate'
    preset: 'server'

  local:
    command: 'uv run --frozen uvicorn inference.main:app --reload --port 8000'
    deps:
      - 'contract:generate'
    preset: 'server'
