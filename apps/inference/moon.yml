$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'python'
stack: 'backend'
tags:
  - 'fastapi'
  - 'inference'

project:
  description: 'FastAPI service that owns model loading and CTC decoding.'

dependsOn:
  - 'contract'

tasks:
  typecheck:
    deps:
      - 'contract:generate'

  test:
    deps:
      - 'contract:generate'

  dev:
    command:
      - 'uv'
      - 'run'
      - 'python'
      - '-m'
      - 'uvicorn'
      - 'inference.main:app'
      - '--reload'
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8000'
    deps:
      - 'contract:generate'
    preset: 'server'

  modalServe:
    command:
      - 'uv'
      - 'run'
      - '--group'
      - 'deploy'
      - 'modal'
      - 'serve'
      - 'modal_app.py'
    deps:
      - 'contract:generate'
    preset: 'server'

  modalDeploy:
    command:
      - 'uv'
      - 'run'
      - '--group'
      - 'deploy'
      - 'modal'
      - 'deploy'
      - 'modal_app.py'
    deps:
      - 'contract:generate'
    preset: 'utility'

  exportLocalModels:
    command:
      - 'uv'
      - 'run'
      - '--group'
      - 'export'
      - 'python'
      - 'scripts/export_local_models.py'
    inputs:
      - 'models/best.ckpt'
      - 'scripts/export_local_models.py'
      - 'src/inference/network.py'
      - 'src/inference/ctc.py'
      - 'pyproject.toml'
      - 'uv.lock'
    outputs:
      - '/apps/web/public/models/handwave-local.onnx'
      - '/apps/web/public/models/handwave-local.onnx.data'
      - '/apps/mobile/HandWave/Resources/HandWaveLocal.mlpackage/**/*'
    preset: 'utility'
